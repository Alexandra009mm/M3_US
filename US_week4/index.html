<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Productos</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    #listaProductos { list-style: none; padding: 0; }
    #listaProductos li { border-left: 4px solid #198754; }
    #listaProductos li.api { border-left-color: #0d6efd; }
    .precio { color: #e65100; font-weight: bold; }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 700px;">

    <h1 class="text-center mb-4">🛒 Gestor de Productos</h1>

    <!-- FORMULARIO -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label">Nombre del producto:</label>
          <input type="text" id="nombre" class="form-control" placeholder="Ej: iPhone 15" />
        </div>

        <div class="mb-3">
          <label class="form-label">Precio (USD):</label>
          <input type="number" id="precio" class="form-control" placeholder="Ej: 999" min="0" />
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción:</label>
          <textarea id="descripcion" class="form-control" placeholder="Características del producto..."></textarea>
        </div>

        <div class="d-flex gap-2">
          <button id="btnAgregar"     class="btn btn-success">➕ Agregar Producto</button>
          <button id="btnSincronizar" type="reset" class="btn btn-primary">🔄 Sincronizar API</button>
        </div>

        <!-- Mensajes de éxito / error / aviso -->
        <div id="mensaje" class="mt-3"></div>

      </div>
    </div>

    <!-- LISTA DE PRODUCTOS -->
    <h2 class="h5 mb-3">📦 Productos (<span id="contador">0</span>)</h2>

    <ul id="listaProductos"></ul>

    <p id="vacio" class="text-center text-muted py-4">No hay productos aún.</p>

  </div>

  <script src="app.js"></script>
</body>
</html>
